<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title>CLI, REST, or MCP: Which, when, and why?</title>
  <desc>Minimal editorial teaser with three technical surfaces: CLI, REST, and MCP.</desc>
  <defs>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#131313"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffd76b"/>
      <stop offset="100%" stop-color="#c79b1b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        1 0 0 0 0.85
        0 1 0 0 0.67
        0 0 1 0 0.15
        0 0 0 0.9 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3a3a3a" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <style>
      .title { font-family: Verdana; font-size: 54px; font-weight: 700; fill: #f5f5f5; letter-spacing: -0.03em; }
      .subtitle { font-family: Verdana; font-size: 28px; font-weight: 500; fill: #c8c8c8; letter-spacing: -0.02em; }
      .label { font-family: Verdana; font-size: 23px; font-weight: 700; fill: #f0f0f0; letter-spacing: 0.06em; }
      .tiny { font-family: Verdana; font-size: 16px; font-weight: 500; fill: #b7b7b7; }
      .mono { font-family: Verdana; font-size: 30px; font-weight: 700; fill: #f5f5f5; }
      .stroke { stroke: #555; stroke-opacity: 0.35; stroke-width: 1.25; }
    </style>
  </defs>

  <rect width="1200" height="627" fill="#101010"/>
  <rect width="1200" height="627" fill="url(#grid)" opacity="0.5"/>

  <g opacity="0.22">
    <circle cx="170" cy="120" r="2" fill="#8b8b8b"/>
    <circle cx="208" cy="94" r="1.5" fill="#8b8b8b"/>
    <circle cx="245" cy="142" r="1.5" fill="#8b8b8b"/>
    <circle cx="944" cy="168" r="1.5" fill="#8b8b8b"/>
    <circle cx="980" cy="136" r="2" fill="#8b8b8b"/>
    <circle cx="1018" cy="188" r="1.5" fill="#8b8b8b"/>
  </g>

  <text class="title" x="72" y="96" font-family="Verdana" font-size="54" font-weight="700">CLI, REST, or MCP</text>
  <text class="subtitle" x="72" y="142" font-family="Verdana" font-size="28" font-weight="500">Which, when, and why?</text>

  <!-- CLI card -->
  <g transform="translate(76,206)">
    <rect x="0" y="0" rx="22" ry="22" width="296" height="258" fill="url(#card)" stroke="#303030" stroke-width="1.5"/>
    <rect x="24" y="26" rx="14" ry="14" width="248" height="122" fill="#161616" stroke="#303030" stroke-width="1.25"/>
    <circle cx="49" cy="51" r="4.5" fill="#4d4d4d"/>
    <circle cx="65" cy="51" r="4.5" fill="#4d4d4d"/>
    <circle cx="81" cy="51" r="4.5" fill="#4d4d4d"/>
    <text class="mono" x="44" y="100" font-family="Verdana" font-size="30" font-weight="700">&gt;_</text>
    <path d="M 112 79 L 140 79" class="stroke"/>
    <path d="M 112 94 L 178 94" class="stroke"/>
    <path d="M 112 109 L 162 109" class="stroke"/>
    <text class="label" x="24" y="188" font-family="Verdana" font-size="23" font-weight="700">CLI</text>
    <text class="tiny" x="24" y="214" font-family="Verdana" font-size="16" font-weight="500">local, direct, task-shaped</text>
  </g>

  <!-- REST card -->
  <g transform="translate(452,206)">
    <rect x="0" y="0" rx="22" ry="22" width="296" height="258" fill="url(#card)" stroke="#303030" stroke-width="1.5"/>
    <rect x="25" y="25" rx="16" ry="16" width="246" height="123" fill="#161616" stroke="#303030" stroke-width="1.25"/>
    <g transform="translate(52,49)" opacity="0.95">
      <circle cx="28" cy="28" r="28" fill="none" stroke="#8b8b8b" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M0 28h56M28 0v56" stroke="#8b8b8b" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M12 12c8 6 24 6 32 0M12 44c8-6 24-6 32 0" fill="none" stroke="#8b8b8b" stroke-opacity="0.55" stroke-width="2"/>
    </g>
    <path d="M 156 73 L 196 73" class="stroke"/>
    <path d="M 156 93 L 226 93" class="stroke"/>
    <path d="M 156 113 L 184 113" class="stroke"/>
    <text class="label" x="25" y="188" font-family="Verdana" font-size="23" font-weight="700">REST</text>
    <text class="tiny" x="25" y="214" font-family="Verdana" font-size="16" font-weight="500">shared contract, app-to-app</text>
  </g>

  <!-- MCP card -->
  <g transform="translate(828,206)">
    <rect x="0" y="0" rx="22" ry="22" width="296" height="258" fill="url(#card)" stroke="#303030" stroke-width="1.5"/>
    <rect x="26" y="24" rx="16" ry="16" width="244" height="123" fill="#161616" stroke="#303030" stroke-width="1.25"/>
    <g transform="translate(51,52)" opacity="0.95">
      <rect x="0" y="0" width="96" height="54" rx="12" fill="none" stroke="#8b8b8b" stroke-opacity="0.55" stroke-width="2"/>
      <rect x="120" y="0" width="56" height="54" rx="12" fill="none" stroke="#8b8b8b" stroke-opacity="0.55" stroke-width="2"/>
      <path d="M 96 27 L 120 27" stroke="#8b8b8b" stroke-opacity="0.55" stroke-width="2.5"/>
      <circle cx="16" cy="27" r="4" fill="#8b8b8b" fill-opacity="0.75"/>
      <circle cx="40" cy="27" r="4" fill="#8b8b8b" fill-opacity="0.75"/>
      <circle cx="64" cy="27" r="4" fill="#8b8b8b" fill-opacity="0.75"/>
      <circle cx="148" cy="27" r="4" fill="#8b8b8b" fill-opacity="0.75"/>
    </g>
    <path d="M 162 77 L 196 77" class="stroke"/>
    <path d="M 162 97 L 228 97" class="stroke"/>
    <path d="M 162 117 L 182 117" class="stroke"/>
    <text class="label" x="26" y="188" font-family="Verdana" font-size="23" font-weight="700">MCP</text>
    <text class="tiny" x="26" y="214" font-family="Verdana" font-size="16" font-weight="500">agent-facing, task-shaped</text>
  </g>

  <!-- connector line -->
  <path d="M 372 328 C 422 328, 426 328, 452 328" stroke="#8c8c8c" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>
  <path d="M 748 328 C 798 328, 802 328, 828 328" stroke="#8c8c8c" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>

  <!-- sparkles -->
  <g filter="url(#softGlow)" transform="translate(1010,78)">
    <path d="M 0 -66 L 14 -18 L 62 0 L 14 18 L 0 66 L -14 18 L -62 0 L -14 -18 Z" fill="#f0c24a" opacity="0.26"/>
    <path d="M -92 88 L -84 112 L -60 120 L -84 128 L -92 152 L -100 128 L -124 120 L -100 112 Z" fill="#e8b93c" opacity="0.95"/>
    <path d="M -46 30 L -41 45 L -26 50 L -41 55 L -46 70 L -51 55 L -66 50 L -51 45 Z" fill="#f0cc60" opacity="0.9"/>
    <path d="M -108 -20 L -103 -5 L -88 0 L -103 5 L -108 20 L -113 5 L -128 0 L -113 -5 Z" fill="#f3d56d" opacity="0.9"/>
  </g>
</svg>
